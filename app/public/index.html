<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: in the installed iPhone app the page runs under the notch; the app pads itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Олег</title>
    <meta name="description" content="Ненациональный мессенджер Олег. Только для своих, по инвайту." />
    <meta name="theme-color" content="#14121F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iPhone: «На экран Домой» turns the site into an app with this icon and name. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Олег" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #14121f;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Олегу нужен JavaScript. Включите его в настройках браузера.</noscript>
    <div id="root"></div>
  </body>
</html>
